# alu8 core pin order for the 4 mm pad frame
# ---------------------------------------------------------------------------
# 29 signal I/O, distributed 8 / 8 / 8 / 5:
#
#   N : a[7:0]                      8
#   S : b[7:0]                      8
#   E : result[7:0]                 8
#   W : op[2:0], zero, carry        5
#                                  --
#                                  29
#
# This differs from the learning run, which put result + zero + carry all on E
# (10 pins). That is not merely unsafe here, it is impossible -- see below.
#
# MEASURED from frame4mmx4mm.gds (KLayout batch, 2026-10-22), replacing the
# earlier "each edge carries 10 pads and some of those are power" hedge:
#
#   Every edge carries exactly 10 pads = 8 SIGNAL + 2 POWER.
#   Signal positions, identical on all four edges:
#       350.95  700.95  1050.95  1750.95  2100.95  2800.95  3150.95  3500.95
#   Power positions:
#       S (y=304.90)   PVSS @1400, PVDD @2450
#       W (x=304.90)   PVDD @1400, PVSS @2450
#       E (x=3695.10)  PVSS @1400, PVDD @2450
#       N (y=3695.10)  PVDD @1400, PVSS @2450
#
#   => 8 signal positions per edge is a hard ceiling. The E edge cannot hold 10.
#   => Power pad position and type MUST NOT be altered (SCL rule).
#
# !! NOT FINAL !!
# Pin order must ultimately match the pad frame one-for-one, because bonding is
# fixed one-to-one with the pin-out: pad order ON the frame determines the
# package pinout, and there is no bond-wire freedom to correct it afterwards.
# Freeze this only after reading
#   - frame4mmx4mm.cdl         (pad instance order and numbering origin)
#   - the Standard_Pad_Frame document (pad numbering direction and origin)
#   - the bonding diagram / CoB footprint for the 40-pin DIP
#
# COST OF THIS SPLIT: the frame ships 4 SPAD00 (input-only) + 4 ASPAD00 (dead:
# 3 terminals, no core path) per edge, so it offers 16 inputs, 16 dead pads and
# ZERO outputs. This bus-aligned order needs 18 pad conversions -- E alone needs
# 8 outputs but has only 4 ASPAD00 slots, so 4 SPAD00 must become outputs too.
# A conversion-minimal order costs 13 but scatters result[7:0] over all four
# edges, which fights routing on a 2-metal process. See TAPEOUT-PLAN.md section 6.
# ---------------------------------------------------------------------------

#N
a\[.*\]

#S
b\[.*\]

#E
result\[.*\]

#W
op\[.*\]
zero
carry
